<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Updatebot Dashboard</title>
  <link rel="stylesheet" href="css/ubdash.css">
  <link rel="shortcut icon" type="image/png" href="images/ubdashfavicon.png">
  <script src="js/utils.js"></script>
  <script src="js/ubdash.js"></script>
</head>

<body id="body">
  <div id="header-bg" class="header-bg"></div>
  <div class="header">
    <img id="title-img" src="images/firefox.png" alt="">
    <div class="title" id="title">Updatebot Dashboard</div>
  </div>

  <div class="command-button-container">
    <div class="settings-button-container">
      <button class="command-button" onclick="openSettings()">Settings</button>
      <img id="alert-icon" class="alert-icon" src="images/alert-icon.png" alt="">
    </div>
    <div class="button-separator"></div>
    <button class="command-button" onclick="refreshList(event);">Refresh</button>
  </div>

  <div class="block-title"><a href="https://bugzilla.mozilla.org/buglist.cgi?f1=reporter&o1=equals&v1=update-bot%40bmo.tld&classification=Client%20Software&classification=Developer%20Infrastructure&classification=Components&classification=Server%20Software&classification=Other&resolution=---&query_format=advanced" target="_blank">Open Updates</a></div>
  <div class="table-container" id="report-open">
    <div class="list-container">
    </div>
  </div>

  <div class="block-title"><a href="https://bugzilla.mozilla.org/buglist.cgi?query_format=advanced&v1=update-bot%40bmo.tld&classification=Client%20Software&classification=Developer%20Infrastructure&classification=Components&classification=Server%20Software&classification=Other&f1=reporter&resolution=FIXED&resolution=WONTFIX&resolution=DUPLICATE&o1=equals" target="_blank">Closed Updates</a></div>
  <div class="table-container" id="report-closed">
    <div class="list-container">
    </div>
  </div>

  <br>

  <div class="errors-container" id="errors">
  </div>

  <br>

  <span class="footer">
    <a href="https://github.com/mozilla/updatebotdashboard" target="_blank">Dashboard source</a> and <a href="https://github.com/mozilla-services/updatebot" target="_blank">Updatebot Source</a> is available on Github. Searchfox Updatebot configuration file <a href="https://searchfox.org/mozilla-central/search?q=moz.yaml" target="_blank">search query</a>.
  </span>

  <dialog id="settings-dialog">
    <form method="dialog">
      <div class="dialog-header">
        <h2 class="dialog-title">Settings</h2>
        <button type="submit" value="cancel" class="dialog-close-btn btn-cancel" aria-label="Close">&#x2715;</button>
      </div>
      <div class="dialog-body">
        <div class="settings-container">

          <div class="settings-header">
            <div class="settings-label-title">Bugzilla Access</div>
          </div>
          <div class="settings-full-row">
            <label for="api-key">API Key&nbsp;<a href="https://wiki.mozilla.org/Bugzilla:REST_API#with_two_factor_authentication" target="_blank" rel="noopener noreferrer">More info</a></label>
            <input type="text" id="api-key" placeholder="Bugzilla API Key" name="key" />
          </div>

          <div class="settings-header">
            <div class="settings-label-title">General Options</div>
          </div>
          <div class="settings-option-row">
            <input type="checkbox" id="option-targets" name="target" />
            <label for="option-targets">
              Target same tab for bug links.
              <small>All bug links will open in the same tab instead of opening new tabs.</small>
            </label>
          </div>
          <div class="settings-option-row">
            <input type="checkbox" id="option-save" name="save" />
            <label for="option-save">
              Persist settings including my Bugzilla API key in local storage.
              <small>When off, settings are only kept for the current browser session.</small>
            </label>
          </div>

          <div class="settings-header">
            <div class="settings-label-title">List Options</div>
          </div>
          <div class="settings-option-row">
            <input type="checkbox" id="option-incdupes" name="incdupes" />
            <label for="option-incdupes">
              Display Duplicates.
              <small>Show duplicate bugs in the list.</small>
            </label>
          </div>

        </div>
      </div>
      <div class="dialog-footer">
        <button class="btn-cancel" value="cancel">Cancel</button>
        <button class="btn-confirm" value="confirm">Apply</button>
      </div>
    </form>
  </dialog>

</body>
</html>
